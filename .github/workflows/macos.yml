name: DeepSeek Code macOS Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        default: "0.1.0"
      publish:
        description: "Publish a GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      RELEASE_VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || inputs.version }}
      SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/deepseek-code-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Agent Runtime dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix apps/deepseek-code-desktop

      - name: Install bundled Chromium runtime
        run: npx playwright install chromium

      - name: Run Agent Runtime and desktop integration tests
        run: npx vitest run tests

      - name: Run Swift migration checks
        run: npm test

      - name: Build DeepSeek Code Tauri DMG
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run release:package

      - name: Verify DMG, checksum and metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run release:verify

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Code-${{ steps.version.outputs.version }}-arm64
          path: |
            dist/DeepSeek-Code-*.dmg
            dist/SHA256SUMS.txt
            dist/release-metadata.json

      - name: Publish GitHub Release
        if: env.SHOULD_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/DeepSeek-Code-*.dmg dist/SHA256SUMS.txt dist/release-metadata.json --clobber
          else
            gh release create "$tag" dist/DeepSeek-Code-*.dmg dist/SHA256SUMS.txt dist/release-metadata.json --generate-notes --title "DeepSeek Code ${{ steps.version.outputs.version }} (Community)"
          fi
