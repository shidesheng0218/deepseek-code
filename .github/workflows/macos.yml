name: DeepSeek Code CLI Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0"
        required: true
        default: "0.2.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      RELEASE_VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: bash scripts/check-no-secrets.sh
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Run product entrypoint checks
        run: npm run test:entrypoints
      - name: Build and package CLI
        run: npm run release:package
      - name: Verify CLI archive
        run: npm run release:verify
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Code-${{ steps.version.outputs.version }}-darwin-arm64
          path: |
            dist/DeepSeek-Code-*.tar.gz
            dist/SHA256SUMS.txt
            dist/release-metadata.json
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          assets=(dist/DeepSeek-Code-*.tar.gz dist/SHA256SUMS.txt dist/release-metadata.json)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --generate-notes --title "DeepSeek Code CLI ${{ steps.version.outputs.version }}"
          fi
