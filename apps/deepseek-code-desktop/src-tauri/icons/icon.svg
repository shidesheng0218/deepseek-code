<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <style>
    .logo-mark { fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .logo-mark { fill: #f8fafc; }
    }
  </style>
  <!-- D shape, 8-bit/pixel-font style: a 6x8 cell grid, each filled cell drawn as its own
       square. Same flat single-color mark as pi's P, own letterform and construction
       (independent cells instead of a single path with a boolean hole). -->
  <g class="logo-mark">
    <rect x="220" y="160" width="60" height="60"/>
    <rect x="280" y="160" width="60" height="60"/>
    <rect x="340" y="160" width="60" height="60"/>
    <rect x="400" y="160" width="60" height="60"/>
    <rect x="220" y="220" width="60" height="60"/>
    <rect x="460" y="220" width="60" height="60"/>
    <rect x="220" y="280" width="60" height="60"/>
    <rect x="520" y="280" width="60" height="60"/>
    <rect x="220" y="340" width="60" height="60"/>
    <rect x="520" y="340" width="60" height="60"/>
    <rect x="220" y="400" width="60" height="60"/>
    <rect x="520" y="400" width="60" height="60"/>
    <rect x="220" y="460" width="60" height="60"/>
    <rect x="520" y="460" width="60" height="60"/>
    <rect x="220" y="520" width="60" height="60"/>
    <rect x="460" y="520" width="60" height="60"/>
    <rect x="220" y="580" width="60" height="60"/>
    <rect x="280" y="580" width="60" height="60"/>
    <rect x="340" y="580" width="60" height="60"/>
    <rect x="400" y="580" width="60" height="60"/>
  </g>
</svg>
