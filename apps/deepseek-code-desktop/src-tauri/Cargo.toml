[package]
name = "deepseek-code"
version = "0.2.0"
description = "DeepSeek Code lightweight desktop application"
authors = ["DeepSeek Code Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
